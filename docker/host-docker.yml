# High-trust host Docker access for custom images only. The hardened Voice Orb
# release image intentionally omits the Docker CLI, so this overlay alone does
# not enable local Docker-daemon management. Raw socket access grants broad
# control over the host Docker daemon.
#   COMPOSE_FILE=docker-compose.yml:docker/host-docker.yml
#   DOCKER_GID=<numeric host Docker group id>
services:
  pandamonium:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add: ["${DOCKER_GID:-963}"]
    environment:
      - PANDAMONIUM_ENABLE_HOST_DOCKER=true
