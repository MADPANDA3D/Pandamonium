title = "Pandamonium gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Test-only MCP Portal fixture keys"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^tests/test_mad_mcp_portal_routes\.py$''']
regexes = ['''fixture-(?:invalid-)?(?:master-)?key-123456789''']

[[allowlists]]
description = "Test-only SSH connection fixture keys (MAD-935)"
targetRules = ["private-key"]
condition = "AND"
regexTarget = "match"
paths = ['''^tests/(?:browser/mad-935-ssh-connections\.spec\.js|test_ssh_connections\.py)$''']
regexes = ['''fake-(?:key|secret)-material''']
