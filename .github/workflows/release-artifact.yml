name: signed release artifact

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography==46.0.5'
      - name: Build and validate curated release notes
        run: |
          set -euo pipefail
          previous_tag="$({ git tag --merged "$GITHUB_SHA^" --list 'v[0-9]*' --sort=-version:refname || true; } | head -n 1)"
          test -n "$previous_tag"
          python scripts/build_release_notes.py \
            --previous-tag "$previous_tag" \
            --tag "$GITHUB_REF_NAME" \
            --notes ".github/releases/$GITHUB_REF_NAME.md" \
            --output dist-release/release-notes.md \
            --comparison-output dist-release/release-comparison.json
      - name: Build signed source artifact
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.PANDAMONIUM_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/release-key.pem"' EXIT
          printf '%s' "$RELEASE_SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/release-key.pem"
          python scripts/build_release_artifact.py \
            --tag "$GITHUB_REF_NAME" \
            --out dist-release \
            --private-key "$RUNNER_TEMP/release-key.pem"
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
            test "$is_draft" = "true"
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file dist-release/release-notes.md \
              --draft=true
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file dist-release/release-notes.md \
              --draft \
              "${release_flags[@]}"
          fi
      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            dist-release/pandamonium-release.json \
            dist-release/pandamonium-*.tar.gz \
            --clobber
      - name: Verify draft body and uploaded artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true"
          verify_dir="$(mktemp -d)"
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > "$verify_dir/release-notes.md"
          python -c 'import pathlib,sys; assert pathlib.Path(sys.argv[1]).read_text().rstrip() == pathlib.Path(sys.argv[2]).read_text().rstrip()' \
            dist-release/release-notes.md "$verify_dir/release-notes.md"
          archive_name="$(basename dist-release/pandamonium-*.tar.gz)"
          mapfile -t uploaded_assets < <(
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort
          )
          expected_assets=("$archive_name" "pandamonium-release.json")
          mapfile -t expected_assets < <(printf '%s\n' "${expected_assets[@]}" | sort)
          diff -u \
            <(printf '%s\n' "${expected_assets[@]}") \
            <(printf '%s\n' "${uploaded_assets[@]}")
          gh release download "$GITHUB_REF_NAME" \
            --dir "$verify_dir" \
            --pattern "$archive_name" \
            --pattern pandamonium-release.json
          cmp "dist-release/$archive_name" "$verify_dir/$archive_name"
          cmp dist-release/pandamonium-release.json "$verify_dir/pandamonium-release.json"
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" --draft=false
