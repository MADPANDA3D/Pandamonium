name: signed release artifact

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography==46.0.5'
      - name: Build signed source artifact
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.PANDAMONIUM_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/release-key.pem"' EXIT
          printf '%s' "$RELEASE_SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/release-key.pem"
          python scripts/build_release_artifact.py \
            --tag "$GITHUB_REF_NAME" \
            --out dist-release \
            --private-key "$RUNNER_TEMP/release-key.pem"
      - name: Publish immutable update assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --draft \
              "${release_flags[@]}"
          fi

          is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
          if [[ "$is_draft" != "true" ]]; then
            mapfile -t published_assets < <(
              gh release view "$GITHUB_REF_NAME" --json assets \
                --jq '.assets[].name' | sort
            )
            expected_assets=(
              "$(basename dist-release/pandamonium-*.tar.gz)"
              "pandamonium-release.json"
            )
            mapfile -t expected_assets < <(printf '%s\n' "${expected_assets[@]}" | sort)
            diff -u \
              <(printf '%s\n' "${expected_assets[@]}") \
              <(printf '%s\n' "${published_assets[@]}")
            exit 0
          fi

          gh release upload "$GITHUB_REF_NAME" \
            dist-release/pandamonium-release.json \
            dist-release/pandamonium-*.tar.gz \
            --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
